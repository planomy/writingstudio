'use strict';
const WEEKS=[{"title": "The bag from tomorrow", "junior": {"level": "junior", "present": "My dog drags a school bag through the gate. I open the zip and find a newspaper dated tomorrow. My photograph fills the front page. Under it, a headline says that I rescue the town. The dog sits on my foot and waits.", "past": "My dog dragged a school bag through the gate. I opened the zip and found a newspaper dated the next day. My photograph filled the front page. Under it, a headline said that I rescued the town. The dog sat on my foot and waited.", "story": "A dog brings you tomorrow’s newspaper. Your photo is on the front, but the headline is covered in mud. Begin just before you wipe it clean. Make the dog do something unusual.", "question": "Should the school let students bring a pet for one special afternoon?", "facts": ["In a fictional class survey, 18 of 25 students want a pet afternoon.", "Three students report allergies to cats or dogs.", "The hall has a separate covered outdoor area.", "A visiting animal handler offers a demonstration without student pets."], "twist": "You want to bring your dog, but your friend has an allergy. Write a solution that takes both people seriously.", "vocab": [{"word": "hesitate", "definition": "Pause because you are unsure.", "example": "I hesitated before wiping the mud off the headline."}, {"word": "clue", "definition": "A detail that helps solve a problem.", "example": "The green ink was our first clue."}, {"word": "ordinary", "definition": "Usual rather than strange.", "example": "The ordinary school bag held an impossible newspaper."}], "feeling": "curious", "metaphor": ["School bell", "An impatient bird"], "starts": ["My dog drags a school bag through the gate.", "I open the zip and find a newspaper dated tomorrow.", "My photograph fills the front page."], "punctuation": "my dog drags a school bag through the gate i open the zip and find a newspaper dated tomorrow my photograph fills the front page under it a headline says that i rescue the town the dog sits on my foot and waits", "verbs": [{"prompt": "The dog <b>went</b> through the gate, dragging the heavy bag.", "model": "The dog <b>hauled</b> the heavy bag through the gate."}, {"prompt": "Mia <b>looked</b> at the tiny date until her eyes hurt.", "model": "Mia <b>peered</b> at the tiny date."}, {"prompt": "I <b>said</b>, “Don’t open it,” so quietly that only my sister heard.", "model": "I <b>whispered</b>, “Don’t open it.”"}, {"prompt": "The younger child <b>held</b> the envelope tightly against his chest.", "model": "The younger child <b>clutched</b> the envelope against his chest."}, {"prompt": "We <b>moved</b> towards the door without making a sound.", "model": "We <b>crept</b> towards the door."}], "concision": {"prompt": "I opened up the bag in order to see what was inside it.", "model": "I opened the bag to see what was inside."}, "spelling": [{"mis": "becuse", "cor": "because"}, {"mis": "frend", "cor": "friend"}, {"mis": "whent", "cor": "went"}, {"mis": "skool", "cor": "school"}], "puzzle": "TEACHER", "passive": ["The bag was opened by Mia.", "The message was written by the sender.", "The photograph was found by the student."]}, "senior": {"level": "senior", "present": "At 7:12, my phone receives a message from my own number. It contains a photograph of our empty classroom. On the whiteboard, someone writes my name beside the word MISSING. I enlarge the photograph and recognise the bracelet on the photographer’s wrist. It is mine.", "past": "At 7:12, my phone received a message from my own number. It contained a photograph of our empty classroom. On the whiteboard, someone had written my name beside the word MISSING. I enlarged the photograph and recognised the bracelet on the photographer’s wrist. It was mine.", "story": "A message from your own number shows tomorrow’s classroom. Your name is beside MISSING. Begin with a believable ordinary morning. End the opening on one small detail that makes the photo impossible.", "question": "Should a school be allowed to inspect a student’s phone after a reported threat?", "facts": ["In this fictional school, a threatening message is reported at 8:10.", "The phone’s owner offers to show that message only.", "A proposed search would include unrelated private conversations.", "The school can contact families and use its existing safety procedures."], "twist": "Balance a genuine safety concern with privacy. Propose a limit, rather than pretending one concern does not matter.", "vocab": [{"word": "assumption", "definition": "An idea accepted before it has been checked.", "example": "My assumption was that the message was a prank."}, {"word": "verify", "definition": "Check whether something is accurate.", "example": "I verified the time before accusing anyone."}, {"word": "inference", "definition": "A conclusion drawn from clues rather than stated directly.", "example": "The bracelet supported an inference about the photographer."}], "feeling": "uneasy", "metaphor": ["Rumour", "A spark in dry grass"], "starts": ["At 7:12, my phone receives a message from my own number.", "It contains a photograph of our empty classroom.", "On the whiteboard, someone writes my name beside the word MISSING."], "punctuation": "at 7:12 my phone receives a message from my own number it contains a photograph of our empty classroom on the whiteboard someone writes my name beside the word missing i enlarge the photograph and recognise the bracelet on the photographers wrist it is mine", "verbs": [{"prompt": "The editor <b>looked</b> through the photograph with a magnifying glass, checking each face.", "model": "The editor scrutinised the photograph, checking each face."}, {"prompt": "The courier <b>went</b> through the crowd sideways without disturbing anyone.", "model": "The courier edged through the crowd without disturbing anyone."}, {"prompt": "The witness <b>said</b> the date twice, refusing to accept the correction.", "model": "The witness repeated the date, refusing to accept the correction."}, {"prompt": "The councillor <b>gave</b> the newspaper back without answering my question.", "model": "The councillor returned the newspaper without answering my question."}, {"prompt": "The reporter <b>asked</b> whether I recognised the dog; no threat or accusation followed.", "model": "The reporter asked whether I recognised the dog. Keeping “asked” avoids inventing pressure."}], "concision": {"prompt": "The newspaper’s advance prediction about what will happen in the future has not yet been verified and checked for accuracy.", "model": "The newspaper’s prediction has not yet been verified."}, "spelling": [{"mis": "neccesary", "cor": "necessary"}, {"mis": "occured", "cor": "occurred"}, {"mis": "embarass", "cor": "embarrass"}, {"mis": "privilage", "cor": "privilege"}, {"mis": "separate", "cor": "separate"}], "puzzle": "MISUNDERSTANDING", "passive": ["The prediction was checked by the editor.", "The warning was shared by the councillor.", "The photograph was examined by the witness."]}}, {"title": "The fundraiser disaster", "junior": {"level": "junior", "present": "I carry our cake into the school hall. Its icing slides towards one corner. My brother holds the door with his elbow and whispers that nobody will notice. A raspberry drops onto the floor. The judge looks up.", "past": "I carried our cake into the school hall. Its icing slid towards one corner. My brother held the door with his elbow and whispered that nobody would notice. A raspberry dropped onto the floor. The judge looked up.", "story": "Your cake collapses two minutes before judging. Begin at the first wobble. Let your character try a fix that creates a new problem.", "question": "Should a cake competition award a prize for the best recovery from a disaster?", "facts": ["Twelve fictional entries are judged for taste and appearance.", "One cake collapses during transport.", "Its bakers rebuild it into a volcano.", "The original rules do not mention a recovery prize."], "twist": "Explain how a new prize could celebrate creativity without being unfair to teams who followed the original rules.", "vocab": [{"word": "collapse", "definition": "Fall down or lose shape.", "example": "The cake collapsed when the tray tilted."}, {"word": "recover", "definition": "Return to a better state after trouble.", "example": "We recovered by turning the cake into a volcano."}, {"word": "judge", "definition": "Decide after looking carefully.", "example": "The judges tasted every entry."}], "feeling": "disappointed", "metaphor": ["Falling cake", "A tired mountain"], "starts": ["I carry our cake into the school hall.", "Its icing slides towards one corner.", "My brother holds the door with his elbow and whispers that nobody will notice."], "punctuation": "i carry our cake into the school hall its icing slides towards one corner my brother holds the door with his elbow and whispers that nobody will notice a raspberry drops onto the floor the judge looks up", "verbs": [{"prompt": "The raspberry <b>fell</b> slowly down the sloping icing.", "model": "The raspberry <b>slid</b> down the sloping icing."}, {"prompt": "The judge <b>looked</b> at every corner of the cake.", "model": "The judge <b>examined</b> the cake."}, {"prompt": "My brother <b>ate</b> the broken piece in two enormous bites.", "model": "My brother <b>devoured</b> the broken piece."}, {"prompt": "The tray <b>moved</b> from side to side in my hands.", "model": "The tray <b>wobbled</b> in my hands."}, {"prompt": "The cook <b>put</b> the last berry carefully on top.", "model": "The cook <b>placed</b> the last berry on top."}], "concision": {"prompt": "The cake fell down to the floor below.", "model": "The cake fell to the floor."}, "spelling": [{"mis": "peeple", "cor": "people"}, {"mis": "thay", "cor": "they"}, {"mis": "sed", "cor": "said"}, {"mis": "wuz", "cor": "was"}], "puzzle": "FRIENDS", "passive": ["The cake was carried by the bakers.", "The receipt was checked by the organiser.", "The total was announced by the customer."]}, "senior": {"level": "senior", "present": "Our stall sells out in nine minutes. I count the coins twice because the total is too high. The sign promises that every dollar goes to the animal shelter. Behind the table, my teammate opens a receipt for supplies we have not paid for. A customer asks how much we have raised.", "past": "Our stall sold out in nine minutes. I counted the coins twice because the total was too high. The sign promised that every dollar went to the animal shelter. Behind the table, my teammate opened a receipt for supplies we had not paid for. A customer asked how much we had raised.", "story": "Your fundraiser promises that every dollar goes to charity, but supplies were bought on credit. Write the moment someone asks for the total. Make the narrator choose between an impressive answer and an accurate one.", "question": "Should a fundraiser deduct its costs before advertising what it donated?", "facts": ["A fictional stall takes $240.", "Ingredients and packaging cost $65.", "Its poster promises “Every dollar to the shelter”.", "The organisers can publish both income and costs."], "twist": "Make a recommendation that is honest about the promise, the costs and what customers reasonably expected.", "vocab": [{"word": "transparent", "definition": "Open about relevant information or decisions.", "example": "A transparent fundraiser published its costs."}, {"word": "deduct", "definition": "Subtract an amount.", "example": "We deducted the costs from the income."}, {"word": "accountable", "definition": "Expected to explain and take responsibility for actions.", "example": "The organisers were accountable for the promise on the poster."}], "feeling": "conflicted", "metaphor": ["Public promise", "A borrowed ladder"], "starts": ["Our stall sells out in nine minutes.", "I count the coins twice because the total is too high.", "The sign promises that every dollar goes to the animal shelter."], "punctuation": "our stall sells out in nine minutes i count the coins twice because the total is too high the sign promises that every dollar goes to the animal shelter behind the table my teammate opens a receipt for supplies we have not paid for a customer asks how much we have raised", "verbs": [{"prompt": "The organiser <b>looked</b> at every receipt, comparing it with the donation total.", "model": "The organiser examined every receipt, comparing it with the donation total."}, {"prompt": "A volunteer <b>put</b> the cracked trophy carefully between two folded towels.", "model": "A volunteer nestled the cracked trophy between two folded towels."}, {"prompt": "The judge <b>said</b> the decision loudly enough to reach the back of the hall.", "model": "The judge announced the decision to the hall."}, {"prompt": "The treasurer <b>got</b> the missing amount by subtracting costs from takings.", "model": "The treasurer calculated the missing amount by subtracting costs from takings."}, {"prompt": "The baker <b>asked</b> for a new plate, without anger or urgency.", "model": "The baker asked for a new plate. A more dramatic verb would add an unsupported attitude."}], "concision": {"prompt": "The final total amount donated to the shelter was reduced by subtracting the expenses and costs of running the stall.", "model": "The donation total was reduced by subtracting the stall’s costs."}, "spelling": [{"mis": "definitly", "cor": "definitely"}, {"mis": "arguement", "cor": "argument"}, {"mis": "publically", "cor": "publicly"}, {"mis": "independant", "cor": "independent"}, {"mis": "resistence", "cor": "resistance"}], "puzzle": "CHARACTERISTIC", "passive": ["The donation total was calculated by the treasurer.", "The expense record was submitted by the organiser.", "The judging rule was revised by the committee."]}}, {"title": "The substitute robot", "junior": {"level": "junior", "present": "Our substitute teacher rolls into the room on tiny wheels. It calls every student Captain. When Mia asks for a drink, it print  e.display=list(d.verbs.map(v=>v.prompt));e.steps=['Read the clue around each highlighted verb.','Choose a more precise verb for '+(senior?'four':'three')+' sentences. You may adjust nearby wording to avoid repetition.','For one choice, explain what the new verb adds.','Keep one ordinary verb if replacing it would invent an action or change the meaning.'];e.output=senior?'4 revisions + a justified choice':'3 revisions + one explanation';e.support='Say the action in your own words first. Is the person moving quietly, quickly, unsteadily or with effort? Try two candidates before choosing.';e.stretch=senior?'Write two versions of one sentence: the same event described by a sympathetic witness and a suspicious witness. Explain where a word would go beyond the evidence.':'Choose a different verb that would change the character’s mood. Explain what extra clue it would need.';e.model=list(d.verbs.map(v=>v.model));e.note='Accept other choices supported by the clue. Bigger is not better: “asked” does not mean “interrogated”, and “looked” does not always mean “glared”.';
 }else if(id==='starts'){
 e.display=list(d.starts.map(esc));e.steps=['Choose two sentences. Rewrite one beginning with a place or time, and one beginning with an action.','Keep the event and subject clear. Read both versions aloud.','Choose the version that best suits the scene and explain why.','Put your preferred version into a two-sentence opening.'];e.support='Try “Beside the …”, “Before …”, or “Holding …, I …”. If the opening describes an action, make sure the person after the comma is doing it.';e.stretch=senior?'Create a calm version and an urgent version. Vary sentence length as well as the opening. Explain how the order controls what the reader notices.':'Try a very short opening. Does it work better than a longer one?';e.model='<p>Example on another scene: “I saw a wet footprint beside the door.” → “Beside the door, one wet footprint shone.”</p><p>“Holding the torch, I checked the lock.” makes clear that I hold the torch. “Holding the torch, the lock was checked” leaves the action attached to the wrong subject.</p>';e.note='These sentences are starting material, not examples of automatically bad writing. Avoid teaching that sentences beginning with I, The or There are always weak.';
 }else if(id==='clutter'){
 e.display='<div class="scene">'+esc(d.concision.prompt)+'</div><div class="scene">'+esc(senior?'The plan may work if a responsible adult can supervise it.':'The plan may work if an adult helps.')+'</div>';e.steps=['Shorten the first sentence while preserving its meaning.','Read the second sentence. Which words limit the promise honestly? Keep them unless you can justify a stronger claim.','Take one sentence from your own writing. Cut repetition or an empty phrase, then read it aloud.','Explain one word you kept because it does an important job.'];e.output='2 revisions + a reason for keeping a word';e.support='Look for the same idea said twice: “extra additional”, “fell down to the floor below”. Do not simply cross out a, the, is or of.';e.stretch=senior?'Write a five-word headline and a precise longer sentence about the same event. Explain what the headline leaves out.':'Try to cut another word. Stop if the meaning or grammar breaks.';e.model='<p>'+esc(d.concision.model)+'</p><p>“May” and the “if” condition are useful: they show that success is possible, not guaranteed.</p>';e.note='This replaces the old “remove as many stop words as possible” rule. Concision is judgement about meaning and structure, not a ban on common words.';
 }else if(id==='puzzle'){
 e.display='<div class="puzzle">'+esc(d.puzzle)+'</div>';e.steps=['Find '+(senior?'eight':'five')+' words of at least three letters. Do not use names or abbreviations.','Check repeated letters against the puzzle word. Ask about any uncertain word.','Choose two words and write a surprising but understandable sentence.','Challenge a partner to improve that sentence without adding more than five words.'];e.output='Word list + one revised sentence';e.minutes='5–8 min';e.support='Find a familiar three-letter word first. Keep a tally when the same letter appears twice.';e.stretch=senior?'Use three found words in a believable opening. Then remove one: does the writing improve?':'Make one funny sentence and one serious sentence with your words.';e.model='<p>Demonstration with a DIFFERENT word: PLANET can supply plan, net, pet, late and plant. “The pet had a plan” uses two found words in a clear sentence.</p>';e.note='Check vocabulary together; do not imply this is an exhaustive answer key. The puzzle becomes a writing task when students use and revise their found words.';
 }else if(id==='persuasive'){
 e.display='<p class="question">'+esc(d.question)+'</p>'+factbox(d);e.steps=['Choose your position. Say it in one clear sentence.','Develop one reason using a relevant case-file detail. Explain WHY that detail supports your choice.','Address this difficulty: '+d.twist,'Finish with what you want to happen. Read it to someone who might disagree and improve one line.'];e.output=senior?'80–130 words':'40–75 words';e.starter=senior?'My recommendation is … One reason is … The case file shows … This matters because … A reasonable objection is … However, …':'I think … because … The case file says … This matters because … Some people might say … My answer is …';e.support='Build three connected sentences: your choice, one reason with a detail, and why it matters. Rehearse aloud before writing. A labelled dictated response is fine.';e.stretch=senior?'Give the strongest objection fairly. Propose a condition or compromise. Identify something this small case file cannot prove.':'Add one sentence that explains a problem your choice would need to solve.';e.model='<p>Shape example on a DIFFERENT question: “Our club should label its tools. Two brushes went missing last week in this fictional example. Labels would help us return borrowed equipment to the right cupboard. Some members dislike extra jobs, but a five-minute labelling session could save us longer searches.”</p>';e.note='Both sides are allowed. Assess the link between reason, evidence and explanation. All supplied counts belong to invented cases; never present them as real research. Students do not need every starter.';
 }else if(id==='facts'){
 e.display=factbox(d);e.steps=['Group the notes: the situation, the difficulty and a possible response.','Write a paragraph for someone who has not read the notes. Use facts accurately, rather than copying them as separate sentences.','Join ideas where the relationship is clear. Do not turn “could” into “will”.','Check that your paragraph explains the issue without inventing a result.'];e.output=senior?'70–110 words':'35–65 words';e.starter='The situation is … However, … One option would be … This could …';e.support='Choose three notes. Say how the second connects to the first before writing. Keep numbers and conditions unchanged.';e.stretch=senior?'Write a neutral report, then a recommendation. Mark the sentence where reporting turns into judgement.':'Explain why one fact belongs beside another.';e.model='<p>Example with a DIFFERENT case: “Our fictional club has ten paintbrushes, but two are missing after a shared session. Labelling the handles could help members return borrowed brushes. It would not explain where the missing pair went, so the club still needs to check its storage area.”</p>';e.note='A connected paragraph is not automatically persuasive. Here students practise organisation and accurate relationships. Acknowledge uncertainty and separate proposed actions from observed outcomes.';
 }else if(id==='vocab'){
 e.display=d.vocab.map(v=>'<section class="vocab"><h3>'+esc(v.word)+'</h3><p>'+esc(v.definition)+'</p><p><b>In context:</b> '+esc(v.example)+'</p></section>').join('');e.steps=['Explain one word in your own language without repeating the definition.','Use two words in a short scene connected to this week’s situation.','Show the meaning through an action, detail or decision.','Read your scene aloud. Replace a word if it sounds impressive but means the wrong thing.'];e.output=senior?'3–5 sentences using 2 words':'2–3 sentences using 1–2 words';e.support='Start with one word and a clear action. “I hesitated” becomes more specific when we know what you nearly did.';e.stretch=senior?'Create a near-miss example where one word is misused. Explain the difference between the intended and actual meaning.':'Create two characters: one who shows the word, and one who does the opposite.';e.model='<p>Example with “hesitate”: “My hand reached for the envelope, then stopped. If I opened it, I could not pretend I had never seen the name.” The pause shows hesitation without repeating the word.</p>';e.note='Use the supplied contextual definition rather than treating every word as a one-word synonym. Do not require all three words in one overloaded sentence.';
 }else if(id==='punctuation'){
 e.display='<div class="scene">'+esc(d.punctuation)+'</div>';e.steps=['Read the text aloud quietly. Mark where one complete idea ends.','Restore capitals, sentence punctuation and any apostrophes needed. '+(!senior?'Start with the first two sentences.':'Consider commas and a possible dash or colon where appropriate.'),'Compare one punctuation choice with a partner. Explain the effect on meaning or pace.','Check that your revision has not changed the events.'];e.output=senior?'Corrected paragraph + 1 explanation':'2–5 corrected sentences';e.support='Find who or what each sentence is about and what they do. Use a full stop before the next independent event if that makes the meaning clearer.';e.stretch=senior?'Create two valid versions of one passage: measured and urgent. Explain why changing punctuation is not permission to invent new events.':'Explain why a comma alone cannot always join two complete sentences.';e.model='<p>'+esc(d.present)+'</p>';e.note='This is one possible correction. Accept other grammatical sentence boundaries. The original scene may contain tense shifts for memories or prior events; do not mark those wrong merely because they are not present tense.';
 }else if(id==='spelling'){
 const clues={sum:'an unspecified amount',hoping:'jumping on one foot',wit:'the colour of snow',lite:'brightness from a lamp',rite:'correct; the opposite of wrong',hat:'dislike very strongly',ma:'be allowed to',mite:'possibly could',red:'look at and understand written words'};e.display=list(d.spelling.map(v=>'<b>'+esc(v.mis)+'</b>'+(clues[v.mis]?' — intended meaning: '+clues[v.mis]:'')));e.steps=['Write the correct forms. Some are already correct: keep those. Use any meaning clues, then check with a partner before the reveal.','Choose one tricky word. Mark the letter pattern, syllable or word part that needs attention.','Use one corrected word in a sentence about this week’s scene.','Hide your correction and try the tricky word again.'];e.output=senior?'5 corrections + a sentence':'4 corrections + a sentence';e.minutes='5–8 min';e.support='Say the word, look closely at the correct form after the reveal, cover it, write it and check. A useful spelling strategy targets the actual letters.';e.stretch=senior?'Find a related form, such as responsible → responsibility. Identify what changes.':'Make a memory clue for the difficult letters, then test whether it helps.';e.model=list(d.spelling.map(v=>esc(v.cor)));e.note='Some source-bank words recur. Treat these as retrieval practice. “A lot” is two words. Meaning clues distinguish valid words such as “sum” from the intended word “some”. Accept correctly spelled items unchanged.';
 }else if(id==='story'){
 e.display='<div class="scene">'+esc(d.story)+'</div>';e.steps=['Choose who tells the scene and what they want at this moment.','Write '+(senior?'an opening of 100–160 words':'4–7 connected sentences')+'. Include one specific detail and a character’s response.','Leave a question or a choice unresolved. Do not explain the whole mystery immediately.','Read it aloud. Revise one line that tells the reader something an action could reveal.'];e.output=senior?'100–160 words':'4–7 sentences';e.minutes='12–18 min';e.starter=senior?'Choose one if it helps: “I noticed it only when …” / “The first thing she did was …” / “Nobody mentioned …”':'Choose one if it helps: “I nearly missed …” / “Beside me, …” / “Before I could …”';e.support='Say three beats aloud: what changes, what the character does, what happens next. Write those three beats first. Use the prompt’s concrete detail.';e.stretch=senior?'Write the opening from a second viewpoint. Change what the reader knows, not just the pronouns. Keep at least one character’s motive understandable.':'Remove “suddenly” if you used it. Can the event itself create surprise?';e.model='<p>Example on a DIFFERENT scene: “The lift stopped between floors. Dad pressed the button again, more gently this time, as if the first push had offended it. From the speaker came a voice I knew. It was mine, asking us not to open the doors.”</p>';e.note='The example demonstrates a specific disruption, a revealing action and a withheld explanation. Students are not required to copy its style or write horror. Allow a realistic interpretation of a strange prompt.';
 }else if(id==='show'){
 e.display='<div class="scene">'+esc(d.story)+'</div><p class="question">Show '+esc(d.feeling)+' without using that word.</p>';e.steps=['Use this week’s situation, or a realistic version of it.','Write '+(senior?'four to six':'three')+' sentences showing the feeling through an action, a line of speech and a noticed detail.','Avoid naming the feeling. Do not give every character shaking hands or a racing heart.','Ask a reader what they inferred. Revise a clue if the intended feeling is unclear.'];e.output=senior?'4–6 sentences':'3 sentences';e.support='Think: what does the character do with an object? What do they say, or avoid saying? What small thing catches their attention?';e.stretch=senior?'Let the character say the opposite of what their behaviour suggests. Make the contradiction readable without explaining it.':'Show the same feeling in two different characters using different actions.';e.model='<p>Example of nervousness on a DIFFERENT scene: “I straightened the paper until its corners matched the desk. When the teacher called my name, I asked her to repeat the question I had heard perfectly.”</p>';e.note='Showing is a choice, not a ban on naming feelings. Brief telling can be useful between significant moments. Do not insist that one physical behaviour proves one emotion in real people.';
 }else if(id==='metaphor'){
 e.display='<div class="pair">'+esc(d.metaphor[0])+'<br>↔<br>'+esc(d.metaphor[1])+'</div>';e.steps=['Name the shared quality: shape, movement, purpose or effect.','Write a metaphor that makes the connection clear. Do not just put two nouns beside each other.','Write a second sentence that develops the comparison through a detail.','Try the same idea as a simile. Decide which version better fits your scene.'];e.output='2 connected sentences + a comparison';e.support='Try: “The ___ was a ___, [what it did].” Example: “The queue was a sleepy snake, curling around the building.”';e.stretch=senior?'Reject the supplied comparison and invent a less familiar one. Explain its advantage and where it stops fitting.':'Keep the comparison going for one more detail without making it impossible to follow.';e.model='<p>Example with a DIFFERENT pair: “The corridor was a river of backpacks. I waited for a gap in the current before crossing.” Movement connects the two ideas; the second sentence develops it.</p>';e.note='Comparisons need not be literally true. Judge whether the connection is understandable and useful. Avoid treating every comparison as automatically poetic or every simile as a metaphor.';
 }else if(id==='active'){
 e.display=list(d.passive.map(esc));e.steps=['Identify the person or thing doing each action.','Rewrite the three sentences so that the actor comes first. Keep the same tense.','Compare one pair. What does the reader notice first in each version?','Write a passive sentence that makes sense because the actor is unknown or less important.'];e.output='3 rewrites + one deliberate passive sentence';e.support='“The message was read by the student” becomes “The student read the message”. Find the actor after “by”.';e.stretch=senior?'Write two descriptions of the same mistake: one that names responsibility and one that hides it. Explain why passive voice can be useful or evasive depending on the context.':'Explain why “The window was broken overnight” may work even if we do not know who broke it.';e.model=list(d.passive.map(s=>{const m=s.match(/^The (.+) was (.+) by (.+)\.$/);const forms={examined:'examined',calculated:'calculated',reviewed:'reviewed',protected:'protected',verified:'verified',identified:'identified',stored:'stored',drawn:'drew',submitted:'submitted',clarified:'clarified',presented:'presented',broken:'broke',revised:'revised',acknowledged:'acknowledged',read:'read',changed:'changed',noticed:'noticed',opened:'opened',checked:'checked',returned:'returned',carried:'carried',written:'wrote',found:'found',corrected:'corrected',shared:'shared',collected:'collected',awarded:'awarded',moved:'moved',printed:'printed',repaired:'repaired',hidden:'hid',recorded:'recorded',designed:'designed',delivered:'delivered',watered:'watered',offered:'offered',chosen:'chose',saved:'saved',invited:'invited',signed:'signed',announced:'announced',cleaned:'cleaned',tested:'tested',photographed:'photographed',posted:'posted',removed:'removed',readjusted:'readjusted',cancelled:'cancelled',folded:'folded',borrowed:'borrowed',sent:'sent',selected:'selected',explained:'explained'};return esc(m[3][0].toUpperCase()+m[3].slice(1)+' '+(forms[m[2]]||m[2])+' the '+m[1]+'.')}));e.note='Active voice is not automatically superior. Passive voice can focus on a result, protect an unknown actor from invented blame, or conceal responsibility. Discuss the purpose.';
 }
 if(senior){
 const seniorModels={
 vocab:'<p>Example on a DIFFERENT word: “provisional” means accepted for now, subject to later checking. “The club announced a provisional winner while the judges checked the scores.” Calling the result provisional keeps its uncertain status clear; “definite” would change the meaning.</p>',
 starts:'<p>Example on another scene: “The organiser checked the guest list before unlocking the hall.” → “Before unlocking the hall, the organiser checked the guest list.” The second version foregrounds the sequence without changing who acts.</p>',
 puzzle:'<p>Demonstration with a DIFFERENT word: TRIANGLE supplies train, angle, giant, grain and line. “The train carried grain beyond the village” connects two found words without forcing them into an unlikely event.</p>',
 persuasive:'<p>Example on a DIFFERENT question: “The club should trial shared equipment before buying individual sets. In this fictional case, only four of its twelve members attended every session last month, so the attendance record supports a trial rather than an immediate purchase. Shared tools may cause queues; a booking system could test that concern. One month of attendance cannot establish what future demand will be.”</p>',
 facts:'<p>Example on a DIFFERENT case: “In this fictional club, twelve people are enrolled, but only four attended every session last month. Shared equipment could reduce initial costs, although it might create queues. A short trial would allow the club to record demand before deciding how many individual sets to purchase.” The paragraph distinguishes observed attendance from a possible outcome.</p>',
 story:'<p>Example on a DIFFERENT scene: “The council had finally repaired the clock. At noon it struck thirteen, and the repairer quietly removed his name from the invoice. Nobody else seemed to notice. I followed him to the van, holding the receipt he had left behind.” The actions suggest a motive without explaining it.</p>',
 show:'<p>Example of concealed resentment on a DIFFERENT scene: “She congratulated the winner and folded the programme along its printed list of finalists. When he offered to share the photograph, she said the camera battery was flat. It had been charging beside her all afternoon.” Speech and behaviour invite an inference without naming the feeling.</p>',
 metaphor:'<p>Example with a DIFFERENT pair: “The committee’s promise was a bridge drawn on paper. It connected every neighbourhood until somebody asked how they would cross the river.” The comparison distinguishes an attractive proposal from a practical route; it does not prove every proposal will fail.</p>'
 };if(seniorModels[id])e.model=seniorModels[id];
 }
 return e;
}
function card(d){const e=exercise(d,state.activity);return '<article class="card '+d.level+'"><header class="cardheader"><span class="level">'+(d.level==='junior'?'Junior · Years 3–6':'Senior · Years 7–10')+'</span><span class="target">'+esc(e.minutes)+'</span></header><div class="cardbody">'+e.display+'<p class="tasktitle">Your writing · '+esc(e.output)+'</p><ol class="tasklist">'+e.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+(e.starter?'<div class="starter"><b>Useful shape—not a script</b><br>'+esc(e.starter)+'</div>':'')+'<details class="support"><summary>A smaller starting point</summary><p>'+esc(e.support)+'</p></details><aside class="challenge"><b>GO DEEPER</b>'+esc(e.stretch)+'</aside><div class="cardactions"><button data-copy="'+d.level+'">Copy task</button><button data-model="'+d.level+'" aria-expanded="false" aria-controls="model-'+d.level+'">Reveal teacher model / notes</button></div><section class="model" id="model-'+d.level+'" hidden><h3>ONE POSSIBLE RESPONSE / TEACHING EXAMPLE</h3>'+e.model+'<p class="note">'+esc(e.note)+'</p></section></div></article>'}
function render(){remember();$('week').value=state.week;document.body.classList.toggle('dark',state.dark);document.documentElement.style.setProperty('--base',[20,23,26][state.size]+'px');document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===state.level)));$('prev').disabled=state.week===1;$('next').disabled=state.week===WEEKS.length;const a=ACTIVITIES.find(x=>x.id===state.activity);$('tabs').innerHTML=ACTIVITIES.map((x,i)=>'<button role="tab" id="tab-'+x.id+'" aria-selected="'+(x.id===state.activity)+'" aria-controls="activity-panel" tabindex="'+(x.id===state.activity?'0':'-1')+'" data-activity="'+x.id+'"><span class="num">'+(i+1)+'</span>'+esc(x.name)+'</button>').join('');const w=WEEKS[state.week-1];$('main').innerHTML='<section class="lessonhead"><div><div class="eyebrow">Week '+state.week+' · '+esc(w.title)+'</div><h2>'+esc(a.title)+'</h2><p>'+esc(a.intro)+'</p></div><button id="print">Print this activity</button></section><section class="cards '+(state.level==='both'?'':'single')+'" role="tabpanel" id="activity-panel" aria-labelledby="tab-'+state.activity+'">'+(state.level!=='senior'?card(w.junior):'')+(state.level!=='junior'?card(w.senior):'')+'</section>';$('print').onclick=()=>window.print()}
function copyText(d){const e=exercise(d,state.activity),a=ACTIVITIES.find(x=>x.id===state.activity);let content='';if(['persuasive','facts'].includes(a.id))content=(a.id==='persuasive'?d.question+'\n\n':'')+'FICTIONAL CASE FILE\n'+d.facts.join('\n');else if(a.id==='verbs')content=d.verbs.map(v=>plain(v.prompt)).join('\n');else if(a.id==='vocab')content=d.vocab.map(v=>v.word+': '+v.definition+'\n'+v.example).join('\n\n');else if(a.id==='spelling')content=plain(e.display);else if(a.id==='active')content=d.passive.join('\n');else if(a.id==='starts')content=d.starts.join('\n');else if(a.id==='puzzle')content=d.puzzle;else if(a.id==='metaphor')content=d.metaphor.join(' ↔ ');else if(a.id==='clutter')content=d.concision.prompt+'\n\n'+(d.level==='senior'?'The plan may work if a responsible adult can supervise it.':'The plan may work if an adult helps.');else if(a.id==='show')content=d.story+'\nShow '+d.feeling+' without naming it.';else if(a.id==='story')content=d.story;else if(a.id==='punctuation')content=d.punctuation;else content=d.present;return 'Writing Studio · Week '+state.week+' · '+WEEKS[state.week-1].title+'\n'+d.level.toUpperCase()+' · '+a.name+'\n\n'+a.intro+'\n\n'+content+'\n\nYOUR WRITING ('+e.output+')\n'+e.steps.map((s,i)=>(i+1)+'. '+s).join('\n')+(e.starter?'\n\nUseful shape: '+e.starter:'')+'\n\nStarting point: '+e.support+'\n\nGo deeper: '+e.stretch}
async function copy(d){const text=copyText(d);try{await navigator.clipboard.writeText(text);notify('Task copied—paste into your lesson workspace or chat.')}catch{$('dialogcontent').innerHTML='<h2>Copy the task</h2><p>Select and copy this text. Teacher models are excluded.</p><textarea readonly id="copyfallback">'+esc(text)+'</textarea>';$('dialog').showModal();$('copyfallback').select()}}
$('week').innerHTML=WEEKS.map((w,i)=>'<option value="'+(i+1)+'">'+(i+1)+' · '+esc(w.title)+'</option>').join('');$('week').onchange=()=>{state.week=Number($('week').value);render()};$('prev').onclick=()=>{if(state.week>1){state.week--;render()}};$('next').onclick=()=>{if(state.week<WEEKS.length){state.week++;render()}};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;render()});$('font').onclick=()=>{state.size=(state.size+1)%3;render()};$('theme').onclick=()=>{state.dark=!state.dark;render()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Use your browser’s full-screen command.')}};$('close').onclick=()=>$('dialog').close();$('help').onclick=()=>{$('dialogcontent').innerHTML='<div class="help"><h2>Open, share, teach</h2><p>Choose a week and an activity. Display Junior, Senior or Both. This is a bank of short tasks: choose a few for your lesson rather than trying all fourteen.</p><p>Students write in their usual writing space or their books. The smaller starting point supports oral rehearsal and shorter responses; Go deeper adds thinking rather than simply more words.</p><p>Make an attempt before revealing a model. Models are possible answers or demonstrations on a different question. Notes appear on your shared screen when opened.</p><p>Copy task includes instructions, support and challenge, but excludes models. Print gives the selected activity and displayed levels. All classroom content works offline.</p><p>Display preferences are remembered where browser storage is available. No student answers are collected. Case files and their counts are invented; use them for the fictional tasks only.</p><p>Arrow keys navigate the activity tabs when a tab has focus. Escape closes this window.</p></div>';$('dialog').showModal()};$('tabs').addEventListener('click',ev=>{const b=ev.target.closest('[data-activity]');if(b){state.activity=b.dataset.activity;render();$('tab-'+state.activity).focus()}});$('tabs').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;ev.preventDefault();let i=ACTIVITIES.findIndex(a=>a.id===state.activity);i=ev.key==='Home'?0:ev.key==='End'?ACTIVITIES.length-1:(i+(ev.key==='ArrowRight'?1:-1)+ACTIVITIES.length)%ACTIVITIES.length;state.activity=ACTIVITIES[i].id;render();$('tab-'+state.activity).focus()});$('main').addEventListener('click',ev=>{const c=ev.target.closest('[data-copy]');if(c)copy(WEEKS[state.week-1][c.dataset.copy]);const b=ev.target.closest('[data-model]');if(b){const m=$('model-'+b.dataset.model);m.hidden=!m.hidden;b.setAttribute('aria-expanded',String(!m.hidden));b.textContent=m.hidden?'Reveal teacher model / notes':'Hide teacher model / notes'}});render();
</script></body></html>
