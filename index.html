    <title>Writing Studio v3.1 (Semester Pack)</title>

    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        .handwritten {
            font-family: 'Comic Neue', cursive;
        }

        /* Custom Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .dark textarea::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Tab Scroll Hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>

            { mis: "arguement", cor: "argument" }, { mis: "publically", cor: "publicly" }, { mis: "independant", cor: "independent" },
            { mis: "resistence", cor: "resistance" }, { mis: "appearence", cor: "appearance" }, { mis: "basicly", cor: "basically" },
            { mis: "beggining", cor: "beginning" }, { mis: "belive", cor: "believe" }, { mis: "buisness", cor: "business" },
            { mis: "calender", cor: "calendar" }, { mis: "collegue", cor: "colleague" }, { mis: "concensus", cor: "consensus" },
            { mis: "dicipline", cor: "discipline" }, { mis: "existance", cor: "existence" }
        ];

        // 11. STORY (20 Prompts)
        const juniorStory = { topic: "Adventure", starters: ["I found a key...", "The door creaked...", "Behind the wall...", "The map led to...", "Suddenly, a noise...", "The spaceship landed...", "The dragon woke up...", "I shrank to the size of an ant...", "The toys came alive...", "It was a dark and stormy night..."] };
        const seniorStory = { topic: "Thriller", starters: ["It wasn't supposed to end this way...", "Trust is a fragile thing...", "He looked at me with cold eyes...", "The phone rang at midnight...", "I knew I was being watched...", "The evidence was missing...", "She vanished without a trace...", "The clock was ticking...", "I made a terrible mistake...", "The secret was out..."] };

        // 12. SHOW DON'T TELL (30 Emotions)
        const juniorShowDontTell = ["Happy", "Sad", "Angry", "Cold", "Tired", "Hungry", "Scared", "Excited", "Bored", "Hot", "Sick", "Surprised", "Shy", "Proud", "Nervous", "Thirsty", "Hurt", "Lonely", "Strong", "Weak"];
        const seniorShowDontTell = ["Anxious", "Arrogant", "Regretful", "Overwhelmed", "Suspicious", "Relieved", "Impatient", "Jealous", "Guilty", "Confused", "Determined", "Hopeless", "Infatuated", "Indifferent", "Frustrated", "Awed", "Disgusted", "Nostalgic", "Embarrassed", "Paranoid"];

        // 13. METAPHOR (30 Pairs)
        const juniorMetaphors = [
            ["Sun", "Ball"], ["Moon", "Light"], ["Thunder", "Drum"], ["Wind", "Whistle"], ["Rain", "Tears"], ["Book", "Door"],
            ["School", "Zoo"], ["Idea", "Lightbulb"], ["Life", "Game"], ["Anger", "Fire"], ["Love", "Heart"], ["Time", "River"],
            ["Snow", "Blanket"], ["Stars", "Diamonds"], ["Fog", "Curtain"], ["Cloud", "Cotton"], ["Tree", "Umbrella"], ["Road", "Ribbon"],
            ["City", "Jungle"], ["Computer", "Brain"]
        ];
        const seniorMetaphors = [
            ["Time", "Thief"], ["Jealousy", "Monster"], ["Hope", "Bird"], ["Anger", "Volcano"], ["School", "Factory"], ["Life", "Highway"],
            ["Memory", "Ghost"], ["Society", "Machine"], ["Truth", "Mirror"], ["Lie", "Web"], ["Fear", "Prison"], ["Love", "Battlefield"],
            ["Success", "Ladder"], ["Failure", "Teacher"], ["Depression", "Fog"], ["Future", "Horizon"], ["Past", "Shadow"], ["Money", "Drug"],
            ["Power", "Drug"], ["Wisdom", "Light"]
        ];

        // 14. ACTIVE VOICE (20 Sentences)
        const juniorPassive = [
            "The ball was thrown by the boy.", "The cake was eaten by the dog.", "The song was sung by the class.", "The picture was painted by Mary.",
            "The window was broken by the ball.", "The race was won by the hare.", "The mouse was chased by the cat.", "The book was read by the teacher.",
            "The car was washed by dad.", "The flowers were watered by mom.", "The letter was written by me.", "The game was played by us.",
            "The cookies were baked by grandma.", "The house was built by them.", "The fish was caught by the bear."
        ];
        const seniorPassive = [
            "The decision was made by the committee.", "Mistakes were made during the experiment.", "The novel was written by the author in 1920.", "The city was destroyed by the hurricane.",
            "The law was passed by the senate.", "The theory was proven by the data.", "The message was received by the general.", "The error was corrected by the technician.",
            "The painting was stolen by the thief.", "The solution was found by the student.", "The goal was achieved by the team.", "The policy was criticized by the public.",
            "The concert was attended by thousands.", "The dinner was cooked by the chef.", "The questions were answered by the expert."
        ];


        // --- RENDER LOGIC ---

        const activities = [
            { id: 1, name: "Tense", icon: "clock" },
            { id: 2, name: "Verbs", icon: "zap" },
            { id: 3, name: "Starts", icon: "play-circle" },
            { id: 4, name: "Stop Words", icon: "scissors" },
            { id: 5, name: "Puzzle", icon: "puzzle" },
            { id: 6, name: "Persuasive", icon: "message-square" },
            { id: 7, name: "Facts", icon: "list" },
            { id: 8, name: "Vocab", icon: "book-open" },
            { id: 9, name: "Punctuation", icon: "pen-line" },
            { id: 10, name: "Spelling", icon: "check-check" },
            { id: 11, name: "Story", icon: "feather" },
            { id: 12, name: "Show Don't Tell", icon: "eye" },
            { id: 13, name: "Metaphor", icon: "infinity" },
            { id: 14, name: "Active Voice", icon: "arrow-right" }
        ];

        function renderTabs() {
            const container = document.getElementById('tab-buttons');
            container.innerHTML = activities.map((act, index) => `
                <button 
                    onclick="switchTab(${act.id})"
                    class="tab-btn group flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap
                    ${index === 0 ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}"
                    data-id="${act.id}"
                >
                    <i data-lucide="${act.icon}" class="w-4 h-4"></i>
                    ${act.name}
                </button>
            `).join('');
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(parseInt(btn.dataset.id) === id) {
                    btn.className = "tab-btn group flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300";
                } else {
                    btn.className = "tab-btn group flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800";
                }
            });
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.add('hidden');
            });
            document.getElementById(`panel-${id}`).classList.remove('hidden');
            lucide.createIcons();
        }

        function createCard(title, content, type = 'text', solution = null) {
            let contentHtml = '';
            let subtitle = "Activity";
            let placeholder = "Type your answer here...";
            
            if (type === 'text') {
                contentHtml = `<p class="text-slate-800 dark:text-slate-200 text-lg leading-relaxed mb-4">${content}</p>`;
                subtitle = "Read & Rewrite";
            } else if (type === 'list') {
                contentHtml = `<ul class="space-y-3 mb-4">${content.map(item => `
                    <li class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300">
                        ${item}
                    </li>`).join('')}</ul>`;
                subtitle = "Items to Fix";
            } else if (type === 'verb_list') {
                 contentHtml = `<ul class="space-y-4 mb-4">${content.map((item, idx) => `
                    <li class="p-3 bg-slate-50 dark:bg-slate-900/50 rounded border border-slate-200 dark:border-slate-700">
                        <div class="mb-2 text-slate-800 dark:text-slate-200">${item[0]}</div>
                        <div class="hidden text-sm text-green-600 dark:text-green-400 font-bold mt-2" id="sol-${title}-${idx}">Better option: ${item[1]}</div>
                    </li>`).join('')}</ul>`;
                subtitle = "Upgrade the Verbs";
            } else if (type === 'puzzle') {
                contentHtml = `<div class="text-center py-8"><h1 class="text-4xl md:text-5xl font-black text-indigo-900 dark:text-indigo-100 tracking-[0.2em]">${content}</h1><p class="text-slate-500 mt-2 text-sm">How many words can you make?</p></div>`;
                subtitle = "Word Builder";
            } else if (type === 'topic_list') {
                contentHtml = `
                    <div class="mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase">Topic</span>
                        <h4 class="text-xl font-bold text-slate-800 dark:text-white">${content.topic}</h4>
                    </div>
                    <ul class="space-y-2 mb-4">
                        <span class="text-xs font-bold text-slate-400 uppercase">Ideas/Starters</span>
                        ${content.list.map(i => `<li class="text-slate-600 dark:text-slate-300 text-sm">• ${i}</li>`).join('')}
                    </ul>
                `;
                subtitle = "Writing Prompt";
            } else if (type === 'vocab') {
                contentHtml = `<ul class="space-y-4 mb-4">${content.map(item => `
                    <li class="p-3 bg-slate-50 dark:bg-slate-900/50 rounded border border-slate-200 dark:border-slate-700">
                        <div class="font-bold text-indigo-600 dark:text-indigo-400 text-lg">${item.word}</div>
                        <div class="text-slate-600 dark:text-slate-400 italic text-sm">${item.def}</div>
                        <div class="text-slate-800 dark:text-slate-200 mt-1 text-sm">"${item.ex}"</div>
                    </li>`).join('')}</ul>`;
                subtitle = "Words of the Week";
            } else if (type === 'spelling') {
                contentHtml = `<ul class="space-y-4 mb-4">${content.map(item => `
                    <li class="flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-900/50 rounded border border-slate-200 dark:border-slate-700">
                        <div class="font-mono text-lg text-red-500 line-through decoration-2">${item.mis}</div>
                        <div class="hidden text-green-600 dark:text-green-400 font-bold font-mono text-lg">${item.cor}</div>
                    </li>`).join('')}</ul>`;
                subtitle = "Correct the Errors";
            } else if (type === 'emotion') {
                contentHtml = `<div class="text-center py-8">
                    <span class="text-xs font-bold text-slate-400 uppercase">Describe this feeling:</span>
                    <h1 class="text-4xl font-bold text-indigo-900 dark:text-indigo-100 mt-2">${content}</h1>
                    <p class="text-slate-500 mt-4 text-sm italic">Do not use the word "${content}". Describe the physical signs.</p>
                </div>`;
                subtitle = "Show, Don't Tell";
                placeholder = "Her hands shook violently as she...";
            } else if (type === 'metaphor') {
                contentHtml = `<div class="text-center py-6">
                    <div class="flex items-center justify-center gap-4 text-xl font-bold text-slate-800 dark:text-white">
                        <div class="p-3 bg-indigo-100 dark:bg-indigo-900 rounded-lg">${content[0]}</div>
                        <span class="text-slate-400">+</span>
                        <div class="p-3 bg-indigo-100 dark:bg-indigo-900 rounded-lg">${content[1]}</div>
                    </div>
                    <p class="text-slate-500 mt-4 text-sm">Write a sentence combining these two concepts.</p>
                </div>`;
                subtitle = "Metaphor Machine";
            } else if (type === 'passive') {
                contentHtml = `<ul class="space-y-3 mb-4">${content.map(item => `
                    <li class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300">
                        ${item}
                    </li>`).join('')}</ul>`;
                subtitle = "Change to Active Voice";
            }

            let revealBtn = '';
            if (type === 'verb_list' || type === 'spelling') {
                revealBtn = `
                    <button onclick="this.parentElement.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden')); this.remove()" class="mt-3 text-xs font-bold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">
                        Reveal Answers
                    </button>
                `;
            }

            return `
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col h-full">
                    <div class="bg-slate-50 dark:bg-slate-900 p-3 border-b border-slate-200 dark:border-slate-700">
                        <h3 class="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wide text-sm">${title} <span class="mx-2 opacity-50">|</span> <span class="text-indigo-500 text-xs">${subtitle}</span></h3>
                    </div>
                    <div class="p-5 flex-grow flex flex-col">
                        ${contentHtml}
                        ${revealBtn}
                        <div class="mt-4">
                            <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Your Workspace</label>
                            <textarea class="w-full h-32 p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none dark:text-white handwritten resize-none" placeholder="${placeholder}"></textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderContent() {
            const container = document.getElementById('tab-panels');
            
            const jTense = getRandomItem(juniorTenseParagraphs);
            const sTense = getRandomItem(seniorTenseParagraphs);
            const jVerbs = getNRandomItems(juniorVerbSentences, 5);
            const sVerbs = getNRandomItems(seniorVerbSentences, 5);
            const jStarts = getNRandomItems(juniorBadStarts, 5);
            const sStarts = getNRandomItems(seniorBadStarts, 5);
            const jStops = getNRandomItems(juniorStopWords, 5);
            const sStops = getNRandomItems(seniorStopWords, 5);
            const jPuzzle = getRandomItem(juniorPuzzles);
            const sPuzzle = getRandomItem(seniorPuzzles);
            const jPers = { topic: getRandomItem(juniorPersuasiveTopics), list: ["In my opinion...", "I believe that...", "For example...", "Finally..."] };
            const sPers = { topic: getRandomItem(seniorPersuasiveTopics), list: ["It is undeniably true that...", "Critics may argue...", "However, the evidence suggests...", "Ultimately..."] };
            const jFactData = getRandomItem(juniorFacts);
            const sFactData = getRandomItem(seniorFacts);
            const jFact = { topic: jFactData.topic, list: jFactData.facts };
            const sFact = { topic: sFactData.topic, list: sFactData.facts };
            const jVocab = getNRandomItems(juniorVocab, 3);
            const sVocab = getNRandomItems(seniorVocab, 3);
            const jPunc = getRandomItem(juniorPunctuation.length > 10 ? juniorPunctuation : [juniorPunctuation[0]]); // Ensure array handling
            const sPunc = getRandomItem(seniorPunctuation.length > 10 ? seniorPunctuation : [seniorPunctuation[0]]);
            const jSpell = getNRandomItems(juniorSpelling, 4);
            const sSpell = getNRandomItems(seniorSpelling, 5);
            
            // Randomize story topic
            const jStoryT = getRandomItem(juniorStory.starters);
            const sStoryT = getRandomItem(seniorStory.starters);
            const jStoryObj = { topic: "Adventure", list: getNRandomItems(juniorStory.starters, 4) };
            const sStoryObj = { topic: "Thriller", list: getNRandomItems(seniorStory.starters, 4) };

            const jShow = getRandomItem(juniorShowDontTell);
            const sShow = getRandomItem(seniorShowDontTell);
            const jMeta = getRandomItem(juniorMetaphors);
            const sMeta = getRandomItem(seniorMetaphors);
            const jActive = getNRandomItems(juniorPassive, 3);
            const sActive = getNRandomItems(seniorPassive, 3);

            // Re-map simple arrays to what createCard expects for Punctuation if needed (simple string)
            const jPuncString = Array.isArray(juniorPunctuation) ? getRandomItem(juniorPunctuation) : juniorPunctuation;
            const sPuncString = Array.isArray(seniorPunctuation) ? getRandomItem(seniorPunctuation) : seniorPunctuation;


            container.innerHTML = `
                <div id="panel-1" class="tab-panel grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jTense)} ${createCard("Senior Level", sTense)}
                </div>
                <div id="panel-2" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jVerbs, 'verb_list')} ${createCard("Senior Level", sVerbs, 'verb_list')}
                </div>
                <div id="panel-3" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jStarts, 'list')} ${createCard("Senior Level", sStarts, 'list')}
                </div>
                <div id="panel-4" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jStops, 'list')} ${createCard("Senior Level", sStops, 'list')}
                </div>
                <div id="panel-5" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jPuzzle, 'puzzle')} ${createCard("Senior Level", sPuzzle, 'puzzle')}
                </div>
                <div id="panel-6" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jPers, 'topic_list')} ${createCard("Senior Level", sPers, 'topic_list')}
                </div>
                <div id="panel-7" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jFact, 'topic_list')} ${createCard("Senior Level", sFact, 'topic_list')}
                </div>
                <div id="panel-8" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jVocab, 'vocab')} ${createCard("Senior Level", sVocab, 'vocab')}
                </div>
                <div id="panel-9" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jPuncString)} ${createCard("Senior Level", sPuncString)}
                </div>
                <div id="panel-10" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jSpell, 'spelling')} ${createCard("Senior Level", sSpell, 'spelling')}
                </div>
                <div id="panel-11" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jStoryObj, 'topic_list')} ${createCard("Senior Level", sStoryObj, 'topic_list')}
                </div>
                <div id="panel-12" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jShow, 'emotion')} ${createCard("Senior Level", sShow, 'emotion')}
                </div>
                <div id="panel-13" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jMeta, 'metaphor')} ${createCard("Senior Level", sMeta, 'metaphor')}
                </div>
                <div id="panel-14" class="tab-panel hidden grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${createCard("Junior Level", jActive, 'passive')} ${createCard("Senior Level", sActive, 'passive')}
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderContent();
            lucide.createIcons();
            
            document.getElementById('generate-button').addEventListener('click', () => {
                renderContent();
                const activeBtn = document.querySelector('.tab-btn[class*="bg-indigo-100"]');
                if(activeBtn) {
                    switchTab(parseInt(activeBtn.dataset.id));
                }
            });
        });

    </script>
</body>
</html>
