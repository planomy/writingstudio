 e.display='<div class="pair">'+esc(d.metaphor[0])+'<br>↔<br>'+esc(d.metaphor[1])+'</div>';e.steps=['Name the shared quality: shape, movement, purpose or effect.','Write a metaphor that makes the connection clear. Do not just put two nouns beside each other.','Write a second sentence that develops the comparison through a detail.','Try the same idea as a simile. Decide which version better fits your scene.'];e.output='2 connected sentences + a comparison';e.support='Try: “The ___ was a ___, [what it did].” Example: “The queue was a sleepy snake, curling around the building.”';e.stretch=senior?'Reject the supplied comparison and invent a less familiar one. Explain its advantage and where it stops fitting.':'Keep the comparison going for one more detail without making it impossible to follow.';e.model='<p>Example with a DIFFERENT pair: “The corridor was a river of backpacks. I waited for a gap in the current before crossing.” Movement connects the two ideas; the second sentence develops it.</p>';e.note='Comparisons need not be literally true. Judge whether the connection is understandable and useful. Avoid treating every comparison as automatically poetic or every simile as a metaphor.';
 }else if(id==='active'){
 e.display=list(d.passive.map(esc));e.steps=['Identify the person or thing doing each action.','Rewrite the three sentences so that the actor comes first. Keep the same tense.','Compare one pair. What does the reader notice first in each version?','Write a passive sentence that makes sense because the actor is unknown or less important.'];e.output='3 rewrites + one deliberate passive sentence';e.support='“The message was read by the student” becomes “The student read the message”. Find the actor after “by”.';e.stretch=senior?'Write two descriptions of the same mistake: one that names responsibility and one that hides it. Explain why passive voice can be useful or evasive depending on the context.':'Explain why “The window was broken overnight” may work even if we do not know who broke it.';e.model=list(d.passive.map(s=>{const m=s.match(/^The (.+) was (.+) by (.+)\.$/);const forms={drawn:'drew',submitted:'submitted',clarified:'clarified',presented:'presented',broken:'broke',revised:'revised',acknowledged:'acknowledged',read:'read',changed:'changed',noticed:'noticed',opened:'opened',checked:'checked',returned:'returned',carried:'carried',written:'wrote',found:'found',corrected:'corrected',shared:'shared',collected:'collected',awarded:'awarded',moved:'moved',printed:'printed',repaired:'repaired',hidden:'hid',recorded:'recorded',designed:'designed',delivered:'delivered',watered:'watered',offered:'offered',chosen:'chose',saved:'saved',invited:'invited',signed:'signed',announced:'announced',cleaned:'cleaned',tested:'tested',photographed:'photographed',posted:'posted',removed:'removed',readjusted:'readjusted',cancelled:'cancelled',folded:'folded',borrowed:'borrowed',sent:'sent',selected:'selected',explained:'explained'};return esc(m[3][0].toUpperCase()+m[3].slice(1)+' '+(forms[m[2]]||m[2])+' the '+m[1]+'.')}));e.note='Active voice is not automatically superior. Passive voice can focus on a result, protect an unknown actor from invented blame, or conceal responsibility. Discuss the purpose.';
 }
 return e;
}
function card(d){const e=exercise(d,state.activity);return '<article class="card '+d.level+'"><header class="cardheader"><span class="level">'+(d.level==='junior'?'Junior · Years 3–6':'Senior · Years 7–10')+'</span><span class="target">'+esc(e.minutes)+'</span></header><div class="cardbody">'+e.display+'<p class="tasktitle">Your writing · '+esc(e.output)+'</p><ol class="tasklist">'+e.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+(e.starter?'<div class="starter"><b>Useful shape—not a script</b><br>'+esc(e.starter)+'</div>':'')+'<details class="support"><summary>A smaller starting point</summary><p>'+esc(e.support)+'</p></details><aside class="challenge"><b>GO DEEPER</b>'+esc(e.stretch)+'</aside><div class="cardactions"><button data-copy="'+d.level+'">Copy task</button><button data-model="'+d.level+'" aria-expanded="false" aria-controls="model-'+d.level+'">Reveal teacher model / notes</button></div><section class="model" id="model-'+d.level+'" hidden><h3>ONE POSSIBLE RESPONSE / TEACHING EXAMPLE</h3>'+e.model+'<p class="note">'+esc(e.note)+'</p></section></div></article>'}
function render(){remember();$('week').value=state.week;document.body.classList.toggle('dark',state.dark);document.documentElement.style.setProperty('--base',[20,23,26][state.size]+'px');document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===state.level)));$('prev').disabled=state.week===1;$('next').disabled=state.week===20;const a=ACTIVITIES.find(x=>x.id===state.activity);$('tabs').innerHTML=ACTIVITIES.map((x,i)=>'<button role="tab" id="tab-'+x.id+'" aria-selected="'+(x.id===state.activity)+'" aria-controls="activity-panel" tabindex="'+(x.id===state.activity?'0':'-1')+'" data-activity="'+x.id+'"><span class="num">'+(i+1)+'</span>'+esc(x.name)+'</button>').join('');const w=WEEKS[state.week-1];$('main').innerHTML='<section class="lessonhead"><div><div class="eyebrow">Week '+state.week+' · '+esc(w.title)+'</div><h2>'+esc(a.title)+'</h2><p>'+esc(a.intro)+'</p></div><button id="print">Print this activity</button></section><section class="cards '+(state.level==='both'?'':'single')+'" role="tabpanel" id="activity-panel" aria-labelledby="tab-'+state.activity+'">'+(state.level!=='senior'?card(w.junior):'')+(state.level!=='junior'?card(w.senior):'')+'</section>';$('print').onclick=()=>window.print()}
function copyText(d){const e=exercise(d,state.activity),a=ACTIVITIES.find(x=>x.id===state.activity);let content='';if(['persuasive','facts'].includes(a.id))content=(a.id==='persuasive'?d.question+'\n\n':'')+'FICTIONAL CASE FILE\n'+d.facts.join('\n');else if(a.id==='verbs')content=d.verbs.map(v=>plain(v.prompt)).join('\n');else if(a.id==='vocab')content=d.vocab.map(v=>v.word+': '+v.definition+'\n'+v.example).join('\n\n');else if(a.id==='spelling')content=plain(e.display);else if(a.id==='active')content=d.passive.join('\n');else if(a.id==='starts')content=d.starts.join('\n');else if(a.id==='puzzle')content=d.puzzle;else if(a.id==='metaphor')content=d.metaphor.join(' ↔ ');else if(a.id==='clutter')content=d.concision.prompt+'\n\n'+(d.level==='senior'?'The plan may work if a responsible adult can supervise it.':'The plan may work if an adult helps.');else if(a.id==='show')content=d.story+'\nShow '+d.feeling+' without naming it.';else if(a.id==='story')content=d.story;else if(a.id==='punctuation')content=d.punctuation;else content=d.present;return 'Writing Studio · Week '+state.week+' · '+WEEKS[state.week-1].title+'\n'+d.level.toUpperCase()+' · '+a.name+'\n\n'+a.intro+'\n\n'+content+'\n\nYOUR WRITING ('+e.output+')\n'+e.steps.map((s,i)=>(i+1)+'. '+s).join('\n')+(e.starter?'\n\nUseful shape: '+e.starter:'')+'\n\nStarting point: '+e.support+'\n\nGo deeper: '+e.stretch}
async function copy(d){const text=copyText(d);try{await navigator.clipboard.writeText(text);notify('Task copied—paste into TUIT, OneNote or chat.')}catch{$('dialogcontent').innerHTML='<h2>Copy the task</h2><p>Select and copy this text. Teacher models are excluded.</p><textarea readonly id="copyfallback">'+esc(text)+'</textarea>';$('dialog').showModal();$('copyfallback').select()}}
$('week').innerHTML=WEEKS.map((w,i)=>'<option value="'+(i+1)+'">'+(i+1)+' · '+esc(w.title)+'</option>').join('');$('week').onchange=()=>{state.week=Number($('week').value);render()};$('prev').onclick=()=>{if(state.week>1){state.week--;render()}};$('next').onclick=()=>{if(state.week<20){state.week++;render()}};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;render()});$('font').onclick=()=>{state.size=(state.size+1)%3;render()};$('theme').onclick=()=>{state.dark=!state.dark;render()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Use your browser’s full-screen command.')}};$('close').onclick=()=>$('dialog').close();$('help').onclick=()=>{$('dialogcontent').innerHTML='<div class="help"><h2>Open, share, teach</h2><p>Choose a week and an activity. Display Junior, Senior or Both. This is a bank of short tasks: choose a few for your lesson rather than trying all fourteen.</p><p>Students write in TUIT, OneNote or their books. The smaller starting point supports oral rehearsal and shorter responses; Go deeper adds thinking rather than simply more words.</p><p>Make an attempt before revealing a model. Models are possible answers or demonstrations on a different question. Notes appear on your shared screen when opened.</p><p>Copy task includes instructions, support and challenge, but excludes models. Print gives the selected activity and displayed levels. All classroom content works offline.</p><p>Display preferences are remembered where browser storage is available. No student answers are collected. Case files and their counts are invented; use them for the fictional tasks only.</p><p>Arrow keys navigate the activity tabs when a tab has focus. Escape closes this window.</p></div>';$('dialog').showModal()};$('tabs').addEventListener('click',ev=>{const b=ev.target.closest('[data-activity]');if(b){state.activity=b.dataset.activity;render();$('tab-'+state.activity).focus()}});$('tabs').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;ev.preventDefault();let i=ACTIVITIES.findIndex(a=>a.id===state.activity);i=ev.key==='Home'?0:ev.key==='End'?ACTIVITIES.length-1:(i+(ev.key==='ArrowRight'?1:-1)+ACTIVITIES.length)%ACTIVITIES.length;state.activity=ACTIVITIES[i].id;render();$('tab-'+state.activity).focus()});$('main').addEventListener('click',ev=>{const c=ev.target.closest('[data-copy]');if(c)copy(WEEKS[state.week-1][c.dataset.copy]);const b=ev.target.closest('[data-model]');if(b){const m=$('model-'+b.dataset.model);m.hidden=!m.hidden;b.setAttribute('aria-expanded',String(!m.hidden));b.textContent=m.hidden?'Reveal teacher model / notes':'Hide teacher model / notes'}});render();
</script></body></html>
